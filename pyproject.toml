[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["core"]
omit = [
  "tests/*",
  "testar_*.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [
  ".git",
  ".venv",
  "venv",
  "env",
  "uploads",
  "banco",
  "logs",
  "relatorios",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
